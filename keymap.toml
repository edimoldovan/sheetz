# Sheetz key bindings — Excel-compatible defaults.
#
# Format:  "Chord" = "command_id"
# Chords are Modifier+Key, e.g. "Ctrl+Shift+S". Modifiers: Ctrl, Shift, Alt.
# Key names: A-Z, 0-9, F1-F12, ArrowUp/ArrowDown/ArrowLeft/ArrowRight,
# Home, End, PageUp, PageDown, Delete, Backspace, Enter, Tab, Escape, Space...
#
# Sheetz looks for this file in: $SHEETZ_KEYMAP, ./keymap.toml,
# ~/.config/sheetz/keymap.toml — first hit wins. Edit and restart.
#
# Note: Ctrl+C / Ctrl+X / Ctrl+V additionally work through the platform
# clipboard events regardless of what is bound here.

[bindings]
# Navigation
"ArrowUp" = "move_up"
"ArrowDown" = "move_down"
"ArrowLeft" = "move_left"
"ArrowRight" = "move_right"
"Enter" = "move_down"
"Shift+Enter" = "move_up"
"Tab" = "move_right"
"Shift+Tab" = "move_left"
"PageUp" = "page_up"
"PageDown" = "page_down"
"Home" = "home"
"Ctrl+Home" = "home_all"
"Ctrl+End" = "end_data"

# Jump to edge of data region (Excel Ctrl+Arrow)
"Ctrl+ArrowUp" = "jump_up"
"Ctrl+ArrowDown" = "jump_down"
"Ctrl+ArrowLeft" = "jump_left"
"Ctrl+ArrowRight" = "jump_right"

# Extend selection
"Shift+ArrowUp" = "extend_up"
"Shift+ArrowDown" = "extend_down"
"Shift+ArrowLeft" = "extend_left"
"Shift+ArrowRight" = "extend_right"
"Ctrl+A" = "select_all"

# Editing
"F2" = "edit_cell"
"Delete" = "clear"
"Backspace" = "clear"
"Ctrl+D" = "fill_down"
"Ctrl+R" = "fill_right"
"Ctrl+Z" = "undo"
"Ctrl+Y" = "redo"
"Ctrl+C" = "copy"
"Ctrl+X" = "cut"
"Ctrl+V" = "paste"

# File
"Ctrl+N" = "new"
"Ctrl+O" = "open"
"Ctrl+S" = "save"
"Ctrl+Shift+S" = "save_as"
"Ctrl+W" = "quit"

# Sheets
"Ctrl+PageDown" = "next_sheet"
"Ctrl+PageUp" = "prev_sheet"
